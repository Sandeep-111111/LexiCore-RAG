services:
  postgres:
    image: postgres:15-alpine
    container_name: lexi_postgres
    environment:
      POSTGRES_DB: lexicore_db
      POSTGRES_USER: lexi_admin
      POSTGRES_PASSWORD: lexi_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - Z:/docker_volumes/postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexi_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - Z:/docker_volumes/qdrant_storage:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: lexi_redis
    ports:
      - "6379:6379"
    volumes:
      - Z:/docker_volumes/redis_data:/data